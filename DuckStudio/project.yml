name: DuckStudio
# xcodegen manifest — the source of truth. The .xcodeproj is generated and
# gitignored. Same pipeline as OpenCastor: xcodegen -> xcodebuild archive ->
# ASC-API upload, driven from the Pi over SSH.
options:
  bundleIdPrefix: com.duckstudio
  deploymentTarget:
    iOS: "17.0"
packages:
  # Presentation truth. Every sentence this app shows about a policy is built
  # and TESTED in here, on Linux — a refusal message is the app's whole value
  # proposition, and one you cannot test is one you learn about in review.
  StudioKit:
    path: ../StudioKit
  # Robot truth. By tag, never by path: an inspector that reports which network
  # it loaded must be built against a pinned reader, or its report describes a
  # parser nobody can identify later.
  DuckKit:
    url: https://github.com/craigm26/duckkit.git
    # 1.30.0 is the floor, not a preference: below it `DuckMove.pose(at:)`
    # answers the base pose for every non-positive time, which makes the
    # keyframe at 0.00 s unreachable — and every motion this app's editor
    # writes starts there. StudioKit/Package.swift pins the same floor.
    from: 1.31.1
  # The engine for a model downloaded onto the phone itself.
  #
  # WHY THIS PACKAGE. "A model on this phone" already existed and meant an
  # address — localhost:8080, where ANOTHER app was serving one. Running one
  # here needs an inference engine, and MLX is Apple's: it reads the quantised
  # weights mlx-community publishes, downloads them from Hugging Face itself,
  # and runs on the phone's unified memory. iOS 17 is its floor and ours.
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm.git
    from: 3.31.4
  # THE TWO PACKAGES THAT MAKE THE ABOVE ABLE TO DOWNLOAD ANYTHING.
  #
  # mlx-swift-lm 3.x decoupled its I/O: `Downloader` and `TokenizerLoader` are
  # protocols with NO conformance in the package, and every `loadModelContainer`
  # overload demands both. The conformances are generated by MLXHuggingFace's
  # macros, which expand to HuggingFace.HubClient and Tokenizers.AutoTokenizer —
  # types that live here. Without these three products the app links, builds,
  # and cannot fetch or tokenize a single model.
  swift-huggingface:
    url: https://github.com/huggingface/swift-huggingface.git
    from: 0.9.0
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers.git
    from: 1.3.0
targets:
  DuckStudio:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
      - Assets.xcassets
    dependencies:
      # MLXLLM MUST BE LINKED INTO THE BINARY even where no symbol of it is
      # named: MLXLMCommon finds its model factory by
      # NSClassFromString("MLXLLM.TrampolineModelFactory"), so a linker that
      # drops it turns every load into noModelFactoryAvailable at runtime.
      - package: mlx-swift-lm
        product: MLXLLM
      # The load and generate API.
      - package: mlx-swift-lm
        product: MLXLMCommon
      # The macros that supply a Downloader and a TokenizerLoader, and the two
      # packages they expand into. See the note above these packages: without
      # them nothing downloads.
      - package: mlx-swift-lm
        product: MLXHuggingFace
      - package: swift-huggingface
        product: HuggingFace
      - package: swift-transformers
        product: Tokenizers
      - package: StudioKit
        product: StudioKit
      - package: DuckKit
        product: DuckKit
      # The fingerprint and the official-release manifest. This is the product
      # that answers "is this one of Pollen's?", which is the question the whole
      # library screen is organised around.
      - package: DuckKit
        product: DuckEvidence
      # The robot's real geometry and the RealityKit entity that draws it —
      # shared with OpenCastor rather than copied, so both apps show the same
      # duck posed by the same kinematics.
      - package: DuckKit
        product: DuckVisual
      - package: DuckKit
        product: DuckRender
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Microduck Studio
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        # REQUIRED THE MOMENT A CBCentralManager IS CONSTRUCTED, and its absence
        # is a crash rather than a refusal. The sentence is the one iOS shows in
        # the prompt, so it says what the app will do with the radio and nothing
        # broader: this app scans for one service UUID and talks to robots.
        NSBluetoothAlwaysUsageDescription: Microduck Studio uses Bluetooth to find a Microduck robot on and around you, pair with it, and ask it which software it is running. It does not use Bluetooth for anything else.
        # REQUIRED because this ships to iPad as well as iPhone. iPad
        # multitasking demands all four, and App Store Connect rejects the
        # upload outright without them — "No orientations were specified" — at
        # export time, long after the archive has succeeded.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # WITHOUT THESE TWO BLOCKS THE APP CANNOT BE HANDED A POLICY. iOS only
        # offers an app in the share sheet, in "Open With", and in Files for a
        # type it has declared. An inspector nobody can send a file to is a
        # library of nine bundled policies and nothing else — so this is not
        # boilerplate, it is the import path.
        #
        # IMPORTED, not exported: ONNX is not this app's format. Declaring it as
        # Exported would claim ownership of a type the ONNX project defined, and
        # would fight every other tool that handles them.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.onnx.model
            UTTypeDescription: ONNX model
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - onnx
          # A FORMAT THIS APP NO LONGER WRITES OR READS, AND THE DECLARATION
          # STAYS ANYWAY. `.duck` is quackd's (rokbenko/quackd, spec `duck: 0`).
          # An older build of this app exported one; `DuckTask` and the export
          # that used it are both gone, so nothing here writes a `.duck` and
          # nothing reads one. Every sentence that used to justify this block
          # cited that deleted type.
          #
          # WHAT IT BUYS NOW, WHICH IS ONE THING. Somebody who used an older
          # build still has these files. Without the declaration a `.duck`
          # resolves to a dynamic type conforming to public.data — a blank icon
          # and no type name anywhere in Files. With it, a leftover file at
          # least looks like something and says what it is.
          #
          # THE IDENTIFIER STAYS UNDER QUACKD'S REPOSITORY, not under
          # com.duckstudio, for the reason that has not changed: this app never
          # defined the format and claiming it would collide the day quackd
          # declares its own.
          #
          # NO CFBundleDocumentTypes ROW, AND THAT IS STILL DELIBERATE. A
          # document type is what makes iOS hand a file to this app, and there
          # is now no reader at all. `LibraryModel.open` names a stray `.duck`
          # rather than defaulting to "not a policy" — see the branch there —
          # so somebody who AirDrops one gets told what it is instead of being
          # told their network will not load.
          #
          # public.plain-text because that is what those older files are: `---`
          # frontmatter and a Markdown body. public.json would be a false claim
          # about the bytes.
          - UTTypeIdentifier: io.github.rokbenko.quackd.duck
            UTTypeDescription: Microduck task
            UTTypeConformsTo:
              - public.plain-text
            UTTypeTagSpecification:
              public.filename-extension:
                - duck
        # REQUIRED ONCE CFBundleDocumentTypes IS DECLARED — ITMS-90737 on the
        # first upload. Declaring the types says "this app opens documents";
        # Apple then insists you say HOW, and there is no default.
        #
        # In place, not copied. The alternative is UISupportsDocumentBrowser,
        # which is for apps built around a UIDocumentBrowserViewController and
        # this is not one — it is handed a file and reads it. With this YES the
        # app receives the original URL under a security-scoped grant, reads it,
        # and writes its own copy into the container keyed by fingerprint; with
        # NO the system would first duplicate the file into an Inbox folder that
        # nothing here ever cleans up, to hand over a copy of a file this app
        # never writes to anyway.
        LSSupportsOpeningDocumentsInPlace: true
        # WITHOUT THIS KEY THE LAB CRASHES THE APP. iOS terminates a process
        # that touches a privacy-sensitive API with no usage description, and
        # `ARSession.run` with a camera-backed configuration is exactly that.
        # Nine files in this target run one — the ghost duck, soccer, room
        # capture and the games — and every one of them was ported from
        # OpenCastor, whose own project.yml declares this key. The screens came
        # across and the key did not, so build 27 dies the moment anybody opens
        # a Lab mode on their floor. There is no compile-time gate that can see
        # this: it is a runtime plist check, so `swiftc -parse`, `swift test`
        # and a clean `xcodebuild` all pass while the binary is unusable.
        NSCameraUsageDescription: "Microduck Studio uses the camera only in the Lab, and only when you choose 'Your floor' — to find the floor you are standing on so a duck can be drawn at its real 25 cm on it. No image is recorded, stored, or sent anywhere, and every Lab mode also runs on a rendered stage with the camera switched off."
        # THE BENCH IS ON YOUR NETWORK, WHICH iOS TREATS AS PRIVATE. A plain
        # request to an RFC1918 or `.local` address needs this key from iOS 14
        # on, and `DuckBench` refuses to send anywhere else — see its `Address`
        # type, which rejects a host that is not obviously local precisely so a
        # typo cannot post a policy to a stranger.
        #
        # NO BONJOUR SERVICES ARE DECLARED, deliberately: nothing here browses
        # for a bench. You type its address. Discovery would be the moment this
        # app started looking at a network it was not pointed at.
        NSLocalNetworkUsageDescription: "Microduck Studio contacts a physics bench on your own network — only the address you type in, and only when you ask it to run something. It never looks for machines by itself and nothing about your policies or motions leaves your network."
        # ATS BLOCKS PLAIN HTTP, AND A PI ON A DESK HAS NO CERTIFICATE. This
        # exception covers local addresses only; everything else in the app is
        # still held to HTTPS, which is what `ModelEndpoint`'s
        # `plaintextToThePublicInternet` refusal is about.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # A shared motion, which is this app's OWN format — so Exported here,
        # unlike ONNX. Declaring it is what lets a .duckintent arriving in a
        # chat or in Files offer Microduck Studio to open it.
        UTExportedTypeDeclarations:
          # The authored-motion format this app WRITES. Declaring it exported
          # is what lets AirDrop and the share sheet hand the type over by
          # identity — OpenCastor imports it as a goal celebration, and until
          # this declaration existed the handoff leaned on the filename
          # extension alone.
          - UTTypeIdentifier: com.duckstudio.move
            UTTypeDescription: Microduck authored motion
            UTTypeConformsTo:
              - public.json
            UTTypeTagSpecification:
              public.filename-extension:
                - duckmove
          - UTTypeIdentifier: com.duckstudio.intent
            UTTypeDescription: Microduck intent
            UTTypeConformsTo:
              - public.json
            UTTypeTagSpecification:
              public.filename-extension:
                - duckintent
        # ONE ROW PER FORMAT THIS APP CAN ACTUALLY FILE, and the one format
        # missing from this list is missing on purpose.
        #
        # `.duck` has no row, for the reason written out beside its imported
        # declaration above: quackd is gone and there is no reader at all. A
        # document type is what makes iOS hand a file over, so declaring one for
        # a format this target cannot put anywhere would make Microduck Studio
        # the app that offers to open a task and then turns it away — an
        # enabled, inert door, which is the thing this app is built not to be.
        # `LibraryModel.open` still NAMES a stray `.duck` rather than calling it
        # a broken network, which is the whole of what is owed to somebody
        # holding one.
        #
        # `.duckplan` has no row either, and that is a REAL GAP rather than a
        # design. It is the format this app now writes and reads —
        # `LibraryModel.open` has a "duckplan" branch and `acceptPlan` files it
        # — but no type is declared and nothing exports one, so no `.duckplan`
        # can be handed to this app and none can leave it. Both paths are
        # currently unreachable. They are kept because the day a plan can
        # travel between two phones, it must land in Plans rather than in the
        # Policies tab as a network that will not load. Wiring that door is
        # declaring the type, adding the row, and adding a share path — all
        # three, or none.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Microduck intent
            LSItemContentTypes:
              - com.duckstudio.intent
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
          # THE ROW WENT IN WITH THE BRANCH THAT FILES THE DRAFT, which is the
          # order that matters: `LibraryModel.open` now takes the live
          # `DraftStore` — not an optional one — decodes a `.duckmove` and puts
          # it in the drafts list, so iOS offering this app for the type leads
          # somewhere. Owner rather than Alternate because this is our format:
          # Microduck Studio writes `.duckmove` and OpenCastor reads it, so a motion
          # coming back the other way should land here by default.
          - CFBundleTypeName: Microduck authored motion
            LSItemContentTypes:
              - com.duckstudio.move
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
          - CFBundleTypeName: ONNX model
            LSItemContentTypes:
              - org.onnx.model
            # Viewer, not Editor: this app reads a policy and never writes back
            # over the file it was given. Claiming Editor would offer to save
            # changes it cannot make.
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.duckstudio.ios
        DEVELOPMENT_TEAM: WYGG3JXWMG
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "39"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
